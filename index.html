<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutTips - Melhores Palpites</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-black tracking-wider text-emerald-400">⚡ FUT<span class="text-white">TIPS</span></h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 font-semibold px-2.5 py-1 rounded-full border border-emerald-500/20">Online</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Widget de Gestão de Banca -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">💰 Gestão de Banca Rápida</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Sua Banca (R$)</label>
                    <input type="number" id="bankroll" value="100" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Stake Sugerida (2%)</label>
                    <div id="stake-result" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm font-bold text-emerald-400 flex items-center">
                        R$ 2.00
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de Palpites do Dia -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-white">🔥 Melhores Palpites do Dia</h2>
                <span class="text-xs text-slate-400">Ao Vivo / Pré-live</span>
            </div>

            <!-- Filtros Avançados: País, Liga e Mercado -->
            <div class="space-y-2 mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <select id="countryFilter" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl p-2.5 focus:outline-none focus:border-emerald-500 font-semibold">
                        <option value="todos">🌍 Todos os Países</option>
                    </select>
                    <select id="leagueFilter" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl p-2.5 focus:outline-none focus:border-emerald-500 font-semibold">
                        <option value="todos">🏆 Todas as Ligas</option>
                    </select>
                </div>
                <div>
                    <select id="marketFilter" class="w-full bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl p-2.5 focus:outline-none focus:border-emerald-500 font-semibold">
                        <option value="todos">🔍 Todos os Mercados</option>
                        <option value="Over 2.5 Gols">Over 2.5 Gols</option>
                        <option value="Ambas Marcam (BTTS)">Ambas Marcam (BTTS)</option>
                        <option value="Mais de 9.5 Cantos">Mais de 9.5 Cantos</option>
                        <option value="Over 1.5 Gols">Over 1.5 Gols</option>
                        <option value="Empate Anula (Casa)">Empate Anula (Casa)</option>
                        <option value="Handicap Asiático -0.5">Handicap Asiático -0.5</option>
                    </select>
                </div>
            </div>

            <!-- Feed onde os jogos sincronizados vão aparecer automaticamente -->
            <div id="tips-container" class="space-y-4">
                <p class="text-xs text-slate-500 text-center py-4">Buscando jogos do dia...</p>
            </div>
        </section>

    </main>

    <!-- Script principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
