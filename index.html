<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTTIPS - Análises Táticas de Elite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-amber-400 text-xl font-black italic tracking-wider">⚡ FUTTIPS</span>
            </div>
            <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Online
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
        
        <!-- Bankroll Management -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-3 flex items-center gap-2">
                💰 Gestão de Banca Rápida
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Sua Banca (R$)</label>
                    <input type="number" id="bankrollInput" value="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white font-semibold focus:outline-none focus:border-amber-400 transition">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Stake Sugerida (2%)</label>
                    <div id="suggestedStake" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-2.5 text-emerald-400 font-bold text-lg flex items-center">
                        R$ 2.00
                    </div>
                </div>
            </div>
        </section>

        <!-- Filters Bar -->
        <section class="flex flex-wrap items-center gap-3 bg-slate-900/40 p-3 rounded-2xl border border-slate-800/80">
            <!-- Seletor de Histórico por Data -->
            <div class="flex items-center gap-2 bg-slate-800/60 px-3 py-2 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 font-medium">Data:</span>
                <input type="date" id="dateFilter" class="bg-slate-950 text-white text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-amber-400">
            </div>

            <!-- Filtro de País -->
            <div class="flex-1 min-w-[130px]">
                <select id="countryFilter" class="w-full bg-slate-900 text-slate-200 text-xs px-3 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400">
                    <option value="">🌍 Todos os Países</option>
                </select>
            </div>

            <!-- Filtro de Liga -->
            <div class="flex-1 min-w-[130px]">
                <select id="leagueFilter" class="w-full bg-slate-900 text-slate-200 text-xs px-3 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400">
                    <option value="">🏆 Todas as Ligas</option>
                </select>
            </div>

            <!-- Filtro de Casa de Aposta -->
            <div class="flex-1 min-w-[130px]">
                <select id="bookmakerFilter" class="w-full bg-slate-900 text-slate-200 text-xs px-3 py-3 rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400">
                    <option value="">🎯 Todas as Casas</option>
                    <option value="Bet365">Bet365</option>
                    <option value="Betano">Betano</option>
                    <option value="Superbet">Superbet</option>
                </select>
            </div>
        </section>

        <!-- Section Title -->
        <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold flex items-center gap-2 text-slate-100">
                🔥 Melhores Palpites do Dia
            </h3>
            <span id="matchCount" class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">Carregando...</span>
        </div>

        <!-- Cards Container -->
        <div id="predictionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards injetados via JavaScript -->
        </div>

    </main>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
