<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutTips - Análises Táticas de Elite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto 24px auto;
      padding-bottom: 15px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      background: #059669;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .prediction-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      border: 1px solid #334155;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .league-tag {
      font-size: 0.8rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .bookmaker-tag {
      font-size: 0.8rem;
      font-weight: bold;
      background: #059669;
      color: white;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .match-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .main-market-box {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #38bdf8;
    }
    .market-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .market-name {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .market-odd {
      color: #f59e0b;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .market-analysis {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .criar-aposta-section {
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      padding-top: 10px;
      margin-top: 10px;
    }
    .criar-aposta-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .criar-aposta-btn:hover {
      background: #1d4ed8;
    }
    .criar-aposta-content {
      display: none;
      margin-top: 10px;
      background: rgba(37, 99, 235, 0.08);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .confidence-badge {
      color: #10b981;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ FUTTIPS</div>
    <div class="status-badge">● Online</div>
  </header>

  <div class="container" id="predictions-container">
    <!-- Os cards de palpites serão injetados dinamicamente aqui pelo app.js -->
  </div>

  <!-- Script principal do aplicativo -->
  <script src="app.js"></script>
</body>
</html>
